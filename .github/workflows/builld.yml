name: Build Morphe patch

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^version[[:space:]]*=[[:space:]]*.*/version = $VERSION/" gradle.properties

      - name: Build .mpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash gradlew :patches:generatePatchesList --no-daemon

      - name: Find and upload .mpp
        id: mpp
        run: |
          shopt -s nullglob
          files=(patches/build/libs/*.mpp)
          selected=()
          for file in "${files[@]}"; do
            case "$(basename "$file")" in
              *sources*|*javadoc*) continue ;;
            esac
            selected+=("$file")
          done
          if (( ${#selected[@]} != 1 )); then
            echo "Expected one distributable .mpp (excluding sources/javadoc); found ${#selected[@]}"
            printf '%s\n' "${selected[@]}"
            exit 1
          fi
          echo "file=${selected[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: morphe-patch-${{ github.ref_name }}
          path: ${{ steps.mpp.outputs.file }}
          if-no-files-found: error

      - name: Publish .mpp to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          FILE="${{ steps.mpp.outputs.file }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "$TAG" --notes "Automated Morphe patch build."
          fi
