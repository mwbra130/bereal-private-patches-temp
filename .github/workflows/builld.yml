name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon
      - name: Get version
        id: version
        run: echo "version=$(grep '^version' gradle.properties | cut -d' ' -f3)" >> $GITHUB_OUTPUT
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: patches/build/libs/patches-*.mpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
