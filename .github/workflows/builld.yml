name: Build and publish Morphe patch

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morphe-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be a version such as v1.8.8; got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          sed -i -E "s/^version[[:space:]]*=[[:space:]].*$/version = $VERSION/" gradle.properties
          grep -E '^version[[:space:]]*=' gradle.properties

      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash gradlew :patches:generatePatchesList --no-daemon

      - name: Verify generated .mpp
        id: verify
        shell: bash
        run: |
          shopt -s nullglob
          files=(patches/build/libs/*.mpp)
          if (( ${#files[@]} != 1 )); then
            echo "Expected exactly one .mpp in patches/build/libs; found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          file="${files[0]}"
          test -s "$file" || { echo "Generated .mpp is empty" >&2; exit 1; }
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "SHA-256:"
          sha256sum "$file"
          echo "Archive contents (first 80 entries):"
          unzip -l "$file" | head -n 85
          if ! unzip -l "$file" | grep -Eq 'app/.*\.class|app/.*\.dex|patches/.*\.class'; then
            echo "No expected patch classes found in .mpp; refusing to publish." >&2
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: morphe-patch-${{ github.ref_name }}
          path: ${{ steps.verify.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="${{ steps.verify.outputs.file }}"
          gh release create "$GITHUB_REF_NAME" "$FILE" \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated Morphe patch build for version $VERSION." \
            --verify-tag
