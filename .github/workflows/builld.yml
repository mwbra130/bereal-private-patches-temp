name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash gradlew :patches:generatePatchesList --no-daemon
      - name: Upload .mpp
        uses: actions/upload-artifact@v4
        with:
          name: patches
          path: patches/build/libs/*.mpp
